<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>IMU Live</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 16px; background: #111; color: #ddd; }
  canvas { width: 100%; height: 220px; background: #1b1b1b; display: block; margin-bottom: 12px; }
  pre { background: #1b1b1b; padding: 8px; }
  .x { color: #e55 } .y { color: #5c5 } .z { color: #59f }
</style>
</head>
<body>
<h3>IMU Live — <span id="conn">connecting…</span></h3>
<div>Accel (g) <span class="x">x</span> <span class="y">y</span> <span class="z">z</span></div>
<canvas id="accel"></canvas>
<div>Gyro (dps) <span class="x">x</span> <span class="y">y</span> <span class="z">z</span></div>
<canvas id="gyro"></canvas>
<pre id="stats">waiting for data…</pre>
<script>
const N = 500, buf = [];  // last N samples, all devices (single IMU for now)
const colors = ['#e55', '#5c5', '#59f'];

function draw(id, key) {
  const c = document.getElementById(id), ctx = c.getContext('2d');
  c.width = c.clientWidth; c.height = c.clientHeight;
  if (!buf.length) return;
  let lim = 1e-6;
  for (const s of buf) for (const a of 'xyz') lim = Math.max(lim, Math.abs(s[key][a]));
  ctx.strokeStyle = '#333'; ctx.beginPath(); ctx.moveTo(0, c.height / 2); ctx.lineTo(c.width, c.height / 2); ctx.stroke();
  [...'xyz'].forEach((a, i) => {
    ctx.strokeStyle = colors[i]; ctx.beginPath();
    buf.forEach((s, j) => ctx.lineTo(j * c.width / (N - 1), c.height / 2 - s[key][a] / lim * (c.height / 2 - 4)));
    ctx.stroke();
  });
  ctx.fillStyle = '#888'; ctx.fillText('±' + lim.toFixed(2), 4, 12);
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws/live`);
  ws.onopen = () => conn.textContent = 'server connected';
  ws.onclose = () => { conn.textContent = 'server disconnected, retrying…'; setTimeout(connect, 1000); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    buf.push(...m.samples); buf.splice(0, Math.max(0, buf.length - N));
    stats.textContent = m.device_id + ' ' + JSON.stringify(m.stats, null, 2);
  };
}
setInterval(() => { draw('accel', 'accel'); draw('gyro', 'gyro'); }, 50);
connect();
</script>
</body>
</html>
